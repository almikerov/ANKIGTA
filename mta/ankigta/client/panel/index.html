<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ANKIGTA</title>
<link rel="stylesheet" href="styles.css" />
</head>
<!--
  Every readable string carries a `data-i18n` key and is filled from the table
  Lua sends. No sentence is written here: the page ships with the key visible,
  and the first state replaces it.
-->
<body>
<div class="shell">

  <header class="topbar" data-window-drag>
    <div class="brand">
      <h1>ANKIGTA</h1>
    </div>
    <div class="status" id="status" data-state="disconnected">
      <span class="dot" aria-hidden="true"></span>
      <span class="detail" id="status-detail"></span>
    </div>
    <div class="study">
      <span class="detail" id="study-detail"></span>
      <button type="button" id="start-study" class="primary" hidden
              data-i18n="study.start"></button>
    </div>
    <button type="button" id="settings" class="quiet" data-i18n="settings.title"></button>
    <button type="button" id="close" class="quiet" data-i18n="common.close"></button>
  </header>

  <p class="notice" id="notice" hidden></p>

  <!-- The gate. Shown whenever there is no companion to talk to, and always
       leaveable: the window this replaces could not be dismissed at all. -->
  <section class="section gate" id="section-connection" hidden>
    <div class="gate-card">
      <div class="gate-fields">
        <label>
          <span data-i18n="settings.connectionPort"></span>
          <input type="number" id="port" min="1" max="65535" />
          <span class="field-error" id="port-error" role="alert" hidden></span>
        </label>
        <label>
          <span data-i18n="settings.connectionToken"></span>
          <input type="password" id="token" autocomplete="off" />
          <span class="field-error" id="token-error" role="alert" hidden></span>
        </label>
      </div>
    </div>
  </section>

  <section class="section entities" id="section-entities" hidden>
    <div class="workspace" id="workspace">

      <div class="column">
        <div class="column-head">
          <h2><span data-i18n="f7.title"></span></h2>
          <span class="count" id="entity-count"></span>
        </div>
        <form class="search" id="filter-form">
          <input type="text" id="filter" data-i18n-placeholder="f7.filter" />
          <button type="submit" data-i18n="f7.filterApply"></button>
        </form>
        <div class="rows" id="rows" role="list"></div>
        <div class="column-actions">
          <button type="button" id="pick-entity" data-i18n="f7.pickEntity"></button>
          <button type="button" id="teleport" data-i18n="f7.teleport"></button>
          <button type="button" id="recheck" data-i18n="f7.recheck"></button>
          <button type="button" id="unlink" data-i18n="f7.unlink"></button>
          <button type="button" id="relink" data-i18n="f7.relink"></button>
        </div>
        <!-- On screen whether or not a row is selected. It used to appear with
             the selection and vanish with it, so the right-hand side of the
             panel jumped every time the player moved down the list. What it
             says with nothing selected is `#entity-empty`; the fields below
             are disabled rather than removed, so their place is kept. -->
        <div class="entity-settings" id="entity-settings">
          <p class="empty" id="entity-empty" data-i18n="f7.noSelection"></p>
          <div class="entity-fields" id="entity-fields">
            <label class="inline entity-name-control">
              <span data-i18n="f7.name"></span>
              <input type="text" id="entity-name" />
            </label>
            <h3 data-i18n="f7.activation"></h3>
            <label class="inline">
              <span data-i18n="f7.radius"></span>
              <input type="number" id="entity-radius" min="0.5" max="100"
                     step="0.5" data-inherited="false"
                     data-i18n-title="f7.radiusClearHint" />
              <!-- Shown when the entity has no radius of its own: the box then
                   holds the global that is actually in force, and this says
                   that is what it is. -->
              <span class="inherited-mark" id="entity-radius-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <!-- Which of the two ways in this entity offers, and the key that
                 takes it. Both are globals a link may override, so both are
                 drawn as the value in force with a mark beside them saying
                 whether it is the entity's own. -->
            <label class="inline">
              <span data-i18n="f7.activationType"></span>
              <span id="entity-activation-type"></span>
              <span class="inherited-mark" id="entity-activation-type-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <label class="inline">
              <span data-i18n="f7.activationKey"></span>
              <span id="entity-activation-key"></span>
              <span class="inherited-mark" id="entity-activation-key-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <!-- A way of looking, and the only control on this pane that is
                 not the entity's own: it draws the *selected* row's Activation
                 Zone, on this player's screen, for as long as F7 is open. It
                 sits here because it and `Show corona` answer one question
                 between them — "what do I see around this row" — and having
                 them on two screens made one decision two journeys.
                 Two states, never three: an entity has nothing to say about a
                 way of looking, so there is no global here to follow. It stays
                 usable with nothing selected for the same reason — it is the
                 player's, not the row's. -->
            <label class="inline">
              <span data-i18n="f7.drawRadius"></span>
              <button type="button" id="entity-draw-radius" class="toggle"
                      aria-pressed="false"
                      data-i18n-title="f7.drawRadiusHint"></button>
            </label>
            <!-- A property of the entity, not a way of looking: the corona
                 stands where the thing stands and everyone sees it. The line
                 above is the other half of what `Draw always` used to confuse.
                 Three-way rather than a checkbox: off on this one entity and
                 following a global that is off look the same today and stop
                 looking the same the moment the global is turned on. -->
            <label class="inline">
              <span data-i18n="f7.showCorona"></span>
              <span id="entity-show-corona"></span>
              <span class="inherited-mark" id="entity-show-corona-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <label class="inline">
              <span data-i18n="f7.coronaColor"></span>
              <!-- A mount point, not markup: the picker is the one ticket 03
                   built, because a native colour dialog has nowhere to open
                   over a page rendered into a game window. -->
              <span id="entity-corona-color"></span>
              <span class="inherited-mark" id="entity-corona-color-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <label class="inline">
              <span data-i18n="f7.coronaOpacity"></span>
              <input type="number" id="entity-corona-opacity" min="0" max="1"
                     step="0.05" data-inherited="false"
                     data-i18n-title="f7.coronaOpacityClearHint" />
              <span class="inherited-mark" id="entity-corona-opacity-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <!-- What this object says in Review mode `Show text`: a line from
                 its card's note, drawn on the object itself. Here on every
                 row whatever the mode is — the three overrides are set here,
                 and a player setting them has to see what they did without
                 changing mode first. -->
            <h3 data-i18n="f7.textLabel"></h3>
            <label class="inline">
              <span data-i18n="f7.textLabel.field"></span>
              <input type="text" id="entity-text-label-field"
                     data-inherited="false"
                     data-i18n-title="f7.textLabel.fieldClearHint" />
              <span class="inherited-mark" id="entity-text-label-field-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <label class="inline">
              <span data-i18n="f7.textLabel.color"></span>
              <!-- The picker ticket 03 built, the one the corona's colour uses.
                   A native colour dialog has nowhere to open over a page
                   rendered into a game window, and a third way to choose a
                   colour would be a third thing to keep in step. -->
              <span id="entity-text-label-color"></span>
              <span class="inherited-mark" id="entity-text-label-color-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <label class="inline">
              <span data-i18n="f7.textLabel.size"></span>
              <input type="number" id="entity-text-label-size" min="0.25"
                     max="5" step="0.05" data-inherited="false"
                     data-i18n-title="f7.textLabel.fieldClearHint" />
              <span class="inherited-mark" id="entity-text-label-size-inherited"
                    data-i18n="f7.inherited" hidden></span>
            </label>
            <!-- What the object really shows. A chosen field the note type
                 lacks, and one holding only media, both fall through to the
                 first field with words — and an object showing something
                 other than what was asked for has to read as such rather than
                 as correct. -->
            <p class="entity-label-state" id="entity-text-label-state"></p>
          </div>
        </div>

        <!-- Deleted from the map, so it is not a Map Entity any more. The
             link was made deliberately, so removing it is asked, not assumed. -->
        <div class="column-actions" id="deleted-decision" hidden>
          <span class="hint" id="deleted-question"></span>
          <button type="button" id="deleted-forget" class="primary"
            data-i18n="f7.deleted.forget"></button>
          <button type="button" id="deleted-keep" data-i18n="f7.deleted.keep"></button>
        </div>

        <div class="column-actions" id="copy-decision" hidden>
          <span class="hint" data-i18n="f7.copyDecisionHint"></span>
          <button type="button" id="copy-original" data-i18n="f7.copyOriginal"></button>
          <button type="button" id="copy-new" data-i18n="f7.copyNew"></button>
        </div>
      </div>

      <div class="column">
        <div class="column-head">
          <h2><span data-i18n="cardPicker.title"></span></h2>
          <div class="history">
            <button type="button" id="undo" data-i18n="f7.undo"></button>
            <button type="button" id="redo" data-i18n="f7.redo"></button>
          </div>
        </div>
        <!-- The expression goes to Anki as written, so the field says so
             rather than inviting a phrase. The switch beside the deck is the
             one Anki's own browser has: it changes what a row below is. -->
        <!-- Every list here is drawn in the page, not as a native <select>.
             MTA blits CEF's popup surface only while it fits inside the
             browser rectangle and drops it whole otherwise (CWebView.cpp), so
             a native dropdown disappears exactly when it grows — which is to
             say, as soon as a collection has enough decks to need one. The
             deck and the Cards/Notes switch are mount points rather than
             markup: one component in `app.js` builds all of them, because two
             dropdowns that behave differently is the thing being fixed. -->
        <form class="search" id="search">
          <input type="text" id="search-query"
                 data-i18n-placeholder="cardPicker.queryHint" />
          <div id="deck-picker"></div>
          <div id="scope-picker"></div>
          <button type="submit" class="primary" data-i18n="cardPicker.search"></button>
        </form>
        <div class="rows" id="cards" role="list"></div>

        <!-- What the list does with the chosen card: link it, replace a link
             with it, or open the editor beside the list. Saving an edit
             belongs to the editor and lives there. -->
        <div class="column-actions">
          <button type="button" id="link" class="primary" data-i18n="cardPicker.link"></button>
          <button type="button" id="replace" data-i18n="f7.replaceCard"></button>
          <button type="button" id="toggle-inspector" aria-expanded="false"
                  data-i18n="inspector.open"></button>
        </div>
      </div>

      <!-- The editor is its own column rather than a block inside the card
           list, and it is drawn only while it is open: a form permanently
           taking a third of the panel is a form taking it from the list. -->
      <div class="column inspector" id="inspector" hidden>
        <div class="inspector-head">
          <h3 data-i18n="inspector.title"></h3>
          <span class="hint" id="inspector-state"></span>
        </div>
        <div class="inspector-fields" id="inspector-fields"></div>
        <label class="inspector-tags">
          <span data-i18n="inspector.tags"></span>
          <input type="text" id="inspector-tags"
                 data-i18n-placeholder="inspector.tagsHint" />
        </label>
        <span class="field-error" id="inspector-error" role="alert"></span>
        <div class="column-actions">
          <button type="button" id="save-note" class="primary"
                  data-i18n="inspector.save"></button>
        </div>
      </div>

    </div>
  </section>

  <section class="section settings" id="section-settings" hidden>
    <div class="settings-head">
      <h2 data-i18n="settings.title"></h2>
      <button type="button" id="edit-hud" data-i18n="ui.editHud"
              aria-pressed="false"></button>
      <button type="button" id="reset-layout" data-i18n="ui.reset"></button>
      <button type="button" id="close-settings" data-i18n="common.close"></button>
    </div>
    <div class="settings-rows" id="settings-rows"></div>
  </section>

  <!-- Clearing overrides across a world is not undone by pressing the control
       again, so it names how many links it is about to change and asks. The
       number comes from the server, which is the side about to do it. -->
  <section class="modal" id="bulk-dialog" role="dialog" aria-modal="true" hidden>
    <div class="modal-card">
      <h2 data-i18n="settings.applyToAll.title"></h2>
      <p id="bulk-question"></p>
      <div class="modal-actions">
        <button type="button" id="bulk-cancel" data-i18n="common.cancel"></button>
        <button type="button" id="bulk-confirm" class="primary"
                data-i18n="settings.applyToAll.confirm"></button>
      </div>
    </div>
  </section>

  <!-- Replacing a card is the one action here that throws away a link the
       player made, so it says what is being thrown away and what replaces it
       before it happens. -->
  <section class="modal" id="replace-dialog" role="dialog" aria-modal="true"
           hidden>
    <div class="modal-card">
      <h2 data-i18n="f7.replaceTitle"></h2>
      <p data-i18n="f7.replaceWarning"></p>
      <dl class="replace-summary">
        <dt data-i18n="f7.replaceCurrent"></dt>
        <dd id="replace-old"></dd>
        <dt data-i18n="f7.replaceNew"></dt>
        <dd id="replace-new"></dd>
      </dl>
      <div class="modal-actions">
        <button type="button" id="replace-cancel" data-i18n="common.cancel"></button>
        <button type="button" id="replace-confirm" class="primary"
                data-i18n="f7.replaceCard"></button>
      </div>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
