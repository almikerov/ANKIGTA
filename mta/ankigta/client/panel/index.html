<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ANKIGTA</title>
<link rel="stylesheet" href="styles.css" />
</head>
<!--
  Every readable string carries a `data-i18n` key and is filled from the table
  Lua sends. Nothing here is written in one language: the page ships with the
  key visible, and the first state replaces it.
-->
<body>
<div class="shell">

  <header class="topbar" data-window-drag>
    <div class="brand">
      <h1>ANKIGTA</h1>
    </div>
    <div class="status" id="status" data-state="disconnected">
      <span class="dot" aria-hidden="true"></span>
      <span class="detail" id="status-detail"></span>
    </div>
    <div class="study">
      <span class="detail" id="study-detail"></span>
      <button type="button" id="start-study" class="primary" hidden
              data-i18n="study.start"></button>
    </div>
    <button type="button" id="settings" class="quiet" data-i18n="settings.title"></button>
    <button type="button" id="close" class="quiet" data-i18n="common.close"></button>
  </header>

  <p class="notice" id="notice" hidden></p>

  <!-- The gate. Shown whenever there is no companion to talk to, and always
       leaveable: the window this replaces could not be dismissed at all. -->
  <section class="section gate" id="section-connection" hidden>
    <div class="gate-card">
      <h2 data-i18n="connection.title"></h2>
      <p data-i18n="panel.connection.explain"></p>
      <div class="gate-fields">
        <label>
          <span data-i18n="connection.manualPort"></span>
          <input type="number" id="port" min="1" max="65535" />
        </label>
        <label>
          <span data-i18n="connection.replacementToken"></span>
          <input type="password" id="token" autocomplete="off" />
        </label>
      </div>
      <div class="gate-actions">
        <button type="button" id="save-connection" data-i18n="settings.apply"></button>
        <button type="button" id="connect" class="primary" data-i18n="connection.connect"></button>
      </div>
    </div>
  </section>

  <section class="section entities" id="section-entities" hidden>
    <div class="workspace">

      <div class="column">
        <div class="column-head">
          <h2><span data-i18n="f7.title"></span></h2>
          <span class="count" id="entity-count"></span>
        </div>
        <form class="search" id="filter-form">
          <input type="text" id="filter" data-i18n-placeholder="f7.filter" />
          <button type="submit" data-i18n="f7.filterApply"></button>
        </form>
        <div class="rows" id="rows" role="list"></div>
        <div class="column-actions">
          <button type="button" id="pick-entity" data-i18n="f7.pickEntity"></button>
          <button type="button" id="teleport" data-i18n="f7.teleport"></button>
          <button type="button" id="recheck" data-i18n="f7.recheck"></button>
          <button type="button" id="unlink" data-i18n="f7.unlink"></button>
          <button type="button" id="relink" data-i18n="f7.relink"></button>
        </div>
        <div class="entity-settings" id="entity-settings" hidden>
          <h3 data-i18n="f7.activation"></h3>
          <label class="inline">
            <span data-i18n="f7.radius"></span>
            <input type="number" id="entity-radius" min="0.5" max="100"
                   step="0.5" />
          </label>
          <label class="inline check">
            <input type="checkbox" id="entity-show-radius" />
            <span data-i18n="f7.showRadius"></span>
          </label>
        </div>

        <div class="column-actions" id="copy-decision" hidden>
          <span class="hint" data-i18n="f7.copyDecisionHint"></span>
          <button type="button" id="copy-original" data-i18n="f7.copyOriginal"></button>
          <button type="button" id="copy-new" data-i18n="f7.copyNew"></button>
        </div>
      </div>

      <div class="column">
        <div class="column-head">
          <h2><span data-i18n="cardPicker.title"></span></h2>
          <div class="history">
            <button type="button" id="undo" data-i18n="f7.undo"></button>
            <button type="button" id="redo" data-i18n="f7.redo"></button>
          </div>
        </div>
        <form class="search" id="search">
          <select id="deck"></select>
          <button type="submit" class="primary" data-i18n="cardPicker.search"></button>
        </form>
        <div class="rows" id="cards" role="list"></div>
        <div class="column-actions">
          <button type="button" id="link" class="primary" data-i18n="cardPicker.link"></button>
          <button type="button" id="replace" data-i18n="f7.replaceCard"></button>
        </div>
      </div>

    </div>
  </section>

  <section class="section settings" id="section-settings" hidden>
    <div class="settings-head">
      <h2 data-i18n="settings.title"></h2>
      <button type="button" id="edit-hud" data-i18n="ui.editHud"
              aria-pressed="false"></button>
      <button type="button" id="reset-layout" data-i18n="ui.reset"></button>
      <button type="button" id="close-settings" data-i18n="common.close"></button>
    </div>
    <div class="settings-rows" id="settings-rows"></div>
  </section>

  <!-- Replacing a card is the one action here that throws away a link the
       player made, so it says what is being thrown away and what replaces it
       before it happens. -->
  <section class="modal" id="replace-dialog" role="dialog" aria-modal="true"
           hidden>
    <div class="modal-card">
      <h2 data-i18n="f7.replaceTitle"></h2>
      <p data-i18n="f7.replaceWarning"></p>
      <dl class="replace-summary">
        <dt data-i18n="f7.replaceCurrent"></dt>
        <dd id="replace-old"></dd>
        <dt data-i18n="f7.replaceNew"></dt>
        <dd id="replace-new"></dd>
      </dl>
      <div class="modal-actions">
        <button type="button" id="replace-cancel" data-i18n="common.cancel"></button>
        <button type="button" id="replace-confirm" class="primary"
                data-i18n="f7.replaceCard"></button>
      </div>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
